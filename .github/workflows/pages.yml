name: Deploy Spanish learning site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-model-${{ runner.os }}-v1

      - name: Cache generated Spanish audio
        uses: actions/cache@v4
        with:
          path: audio
          key: kokoro-spanish-audio-${{ hashFiles('scripts/generate_audio.py') }}

      - name: Install Kokoro TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.7.11" soundfile numpy

      - name: Generate Kokoro Spanish audio
        run: python scripts/generate_audio.py

      - name: Restore Chatterbox A/B test cache
        id: chatterbox-test-cache
        uses: actions/cache@v4
        with:
          path: voice-test/chatterbox-manifest.js
          key: chatterbox-v3-spanish-test-${{ hashFiles('scripts/generate_chatterbox_test.py') }}

      - name: Install Chatterbox TTS for A/B test
        if: steps.chatterbox-test-cache.outputs.cache-hit != 'true'
        run: python -m pip install chatterbox-tts

      - name: Generate Chatterbox V3 A/B samples
        if: steps.chatterbox-test-cache.outputs.cache-hit != 'true'
        run: python scripts/generate_chatterbox_test.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
